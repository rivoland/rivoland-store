<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="description"
      content="RIVOLAND® — Sport. Street. Culture. Launching 11 September 2026.">

<meta name="theme-color"
      content="#070707">

<title>RIVOLAND® — Coming Soon</title>


<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #070707;
    color: #f5f5f0;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}


/* =====================================================
   BACKGROUND
===================================================== */

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(255,255,255,0.075),
            transparent 35%
        );

    pointer-events: none;
    z-index: -3;
}


body::after {
    content: "";
    position: fixed;
    inset: 0;

    background:
        linear-gradient(
            120deg,
            transparent 35%,
            rgba(255,255,255,0.025),
            transparent 65%
        );

    animation: backgroundMove 12s ease-in-out infinite;

    pointer-events: none;
    z-index: -2;
}


@keyframes backgroundMove {

    0% {
        transform: translateX(-15%);
    }

    50% {
        transform: translateX(15%);
    }

    100% {
        transform: translateX(-15%);
    }

}


/* =====================================================
   PAGE
===================================================== */

.page {
    min-height: 100vh;

    display: flex;
    flex-direction: column;

    position: relative;

    overflow: hidden;
}


/* =====================================================
   HEADER
===================================================== */

header {

    width: 100%;

    padding: 28px 42px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    position: relative;

    z-index: 10;
}


.logo {

    font-size: 21px;

    font-weight: 900;

    letter-spacing: 0.22em;
}


.logo sup {

    font-size: 8px;

    margin-left: 2px;

    vertical-align: top;
}


.established {

    font-size: 9px;

    letter-spacing: 0.25em;

    opacity: 0.4;
}


/* =====================================================
   MAIN
===================================================== */

main {

    flex: 1;

    width: 100%;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 30px 20px 60px;
}


.content {

    width: min(1100px, 100%);

    text-align: center;
}


/* =====================================================
   EYEBROW
===================================================== */

.eyebrow {

    font-size: 10px;

    font-weight: 600;

    letter-spacing: 0.38em;

    opacity: 0.45;

    margin-bottom: 25px;

    animation: fadeUp 1s ease forwards;
}


/* =====================================================
   TITLE
===================================================== */

.title {

    font-size: clamp(60px, 13vw, 175px);

    line-height: 0.82;

    font-weight: 900;

    letter-spacing: -0.075em;

    text-transform: uppercase;

    animation: fadeUp 1s ease 0.15s forwards;

    opacity: 0;
}


.title span {

    display: block;
}


.outline {

    color: transparent;

    -webkit-text-stroke:
        1px rgba(245,245,240,0.7);
}


/* =====================================================
   ROTATING VIDEO AREA
===================================================== */

.model-area {

    width: 100%;

    height: 410px;

    margin-top: 35px;

    display: flex;

    justify-content: center;

    align-items: center;

    position: relative;
}


/* Circular studio ring */

.model-ring {

    position: absolute;

    width: 350px;
    height: 350px;

    border: 1px solid rgba(255,255,255,0.13);

    border-radius: 50%;

    box-shadow:
        0 0 80px rgba(255,255,255,0.035);

    animation:
        ringPulse 5s ease-in-out infinite;
}


@keyframes ringPulse {

    0% {
        transform: scale(0.98);
        opacity: 0.45;
    }

    50% {
        transform: scale(1.03);
        opacity: 0.75;
    }

    100% {
        transform: scale(0.98);
        opacity: 0.45;
    }

}


/* =====================================================
   MODEL VIDEO
===================================================== */

.model-video {

    width: 180px;

    height: 365px;

    object-fit: contain;

    display: block;

    position: relative;

    z-index: 3;

    background: transparent;

    border: none;

    outline: none;

    mix-blend-mode: normal;
}


/* =====================================================
   MODEL SHADOW
===================================================== */

.model-shadow {

    position: absolute;

    width: 190px;

    height: 25px;

    bottom: 5px;

    border-radius: 50%;

    background:
        rgba(0,0,0,0.8);

    filter: blur(12px);

    z-index: 1;
}


/* =====================================================
   DESCRIPTION
===================================================== */

.description {

    margin: 10px auto 0;

    max-width: 500px;

    font-size: 13px;

    line-height: 1.7;

    letter-spacing: 0.08em;

    color:
        rgba(245,245,240,0.58);

    animation:
        fadeUp 1s ease 0.3s forwards;

    opacity: 0;
}


/* =====================================================
   COUNTDOWN
===================================================== */

.countdown {

    display: flex;

    justify-content: center;

    align-items: flex-start;

    gap: clamp(10px,4vw,50px);

    margin-top: 48px;

    animation:
        fadeUp 1s ease 0.45s forwards;

    opacity: 0;
}


.time {

    min-width: 70px;
}


.number {

    display: block;

    font-size:
        clamp(35px,6vw,70px);

    line-height: 1;

    font-weight: 700;

    letter-spacing: -0.05em;

    font-variant-numeric:
        tabular-nums;
}


.label {

    display: block;

    margin-top: 11px;

    font-size: 8px;

    letter-spacing: 0.25em;

    text-transform: uppercase;

    opacity: 0.35;
}


.colon {

    font-size: 28px;

    opacity: 0.2;

    padding-top: 5px;
}


/* =====================================================
   LAUNCH DATE
===================================================== */

.launch {

    display: inline-flex;

    align-items: center;

    gap: 15px;

    margin-top: 35px;

    padding: 13px 20px;

    border:
        1px solid rgba(245,245,240,0.13);

    background:
        rgba(255,255,255,0.025);
}


.launch-label {

    font-size: 8px;

    letter-spacing: 0.25em;

    opacity: 0.35;
}


.launch-date {

    font-size: 12px;

    font-weight: 700;

    letter-spacing: 0.16em;
}


/* =====================================================
   CONTACT
===================================================== */

.contact {

    display: flex;

    justify-content: center;

    gap: 15px;

    margin-top: 28px;

    flex-wrap: wrap;
}


.contact a {

    color: #f5f5f0;

    text-decoration: none;

    border:
        1px solid rgba(245,245,240,0.15);

    padding: 13px 20px;

    font-size: 9px;

    font-weight: 700;

    letter-spacing: 0.18em;

    text-transform: uppercase;

    transition:
        background 0.3s,
        border 0.3s,
        transform 0.3s;
}


.contact a:hover {

    background:
        rgba(255,255,255,0.08);

    border-color:
        rgba(255,255,255,0.4);

    transform:
        translateY(-2px);
}


/* =====================================================
   LIVE
===================================================== */

.live {

    display: none;

    margin-top: 45px;

    font-size:
        clamp(40px,7vw,80px);

    font-weight: 900;

    letter-spacing: -0.05em;
}


body.is-live .countdown,
body.is-live .launch {

    display: none;
}


body.is-live .live {

    display: block;

    animation:
        fadeUp 1s ease forwards;
}


/* =====================================================
   FOOTER
===================================================== */

footer {

    padding: 25px 20px 28px;

    text-align: center;
}


.footer-text {

    font-size: 8px;

    font-weight: 600;

    letter-spacing: 0.3em;

    opacity: 0.28;
}


/* =====================================================
   ANIMATION
===================================================== */

@keyframes fadeUp {

    from {

        opacity: 0;

        transform:
            translateY(25px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 650px) {

    header {

        padding: 22px 20px;
    }


    .logo {

        font-size: 17px;

        letter-spacing: 0.18em;
    }


    .established {

        font-size: 7px;

        letter-spacing: 0.18em;
    }


    main {

        padding:
            25px 15px 45px;
    }


    .eyebrow {

        font-size: 8px;

        letter-spacing: 0.25em;

        margin-bottom: 22px;
    }


    .title {

        font-size:
            clamp(52px,17vw,105px);
    }


    .model-area {

        height: 360px;

        margin-top: 25px;
    }


    .model-ring {

        width: 300px;

        height: 300px;
    }


    .model-video {

        width: 180px;

        height: 350px;

        object-fit: contain;
    }


    .description {

        font-size: 11px;

        max-width: 320px;
    }


    .countdown {

        gap: 5px;

        margin-top: 40px;
    }


    .time {

        min-width: 55px;
    }


    .number {

        font-size:
            clamp(27px,9vw,43px);
    }


    .label {

        font-size: 6px;

        letter-spacing: 0.12em;
    }


    .colon {

        font-size: 20px;

        padding-top: 3px;
    }


    .launch {

        margin-top: 30px;

        padding: 11px 14px;

        gap: 10px;
    }


    .contact {

        margin-top: 22px;

        gap: 10px;
    }


    .contact a {

        padding: 12px 14px;

        font-size: 7px;
    }


    footer {

        padding:
            20px 15px 25px;
    }

}


/* =====================================================
   ACCESSIBILITY
===================================================== */

@media (prefers-reduced-motion: reduce) {

    .model-ring,
    body::after {

        animation: none;
    }

}

</style>

</head>


<body>

<div class="page">


<header>

    <div class="logo">
        RIVOLAND<sup>®</sup>
    </div>

        EST. 2026
    </div>

</header>


<main>

<section class="content">


<div class="eyebrow">
    A NEW ERA IS APPROACHING
</div>


<h1 class="title">

    <span>
        MOVE
    </span>

    <span class="outline">

</h1>


<!-- =================================================
     ROTATING FASHION MODEL VIDEO
================================================== -->

<div class="model-area">

    <div class="model-ring"></div>

    <video

        autoplay

<!-- =================================================
     COUNTDOWN JAVASCRIPT
===================================================== -->

<script>

/*
=======================================================
RIVOLAND LAUNCH DATE
11 SEPTEMBER 2026
12:00 AM IST
=======================================================
*/

const launchDate =
    new Date("2026-09-11T00:00:00+05:30").getTime();


function updateCountdown() {

    const now =
        new Date().getTime();


    const difference =
        launchDate - now;


    /* Launch time reached */

    if (difference <= 0) {

        document.body.classList.add("is-live");

        return;
    }


    /* Calculate time */

    const days =
        Math.floor(
            difference /
            (1000 * 60 * 60 * 24)
        );


    const hours =
        Math.floor(
            (difference %
            (1000 * 60 * 60 * 24)) /
            (1000 * 60 * 60)
        );


    const minutes =
        Math.floor(
            (difference %
            (1000 * 60 * 60)) /
            (1000 * 60)
        );


    const seconds =
        Math.floor(
            (difference %
            (1000 * 60)) /
            1000
        );


    /* Display */

    document.getElementById("days")
        .textContent =
        String(days).padStart(2, "0");


    document.getElementById("hours")
        .textContent =
        String(hours).padStart(2, "0");


    document.getElementById("minutes")
        .textContent =
        String(minutes).padStart(2, "0");


    document.getElementById("seconds")
        .textContent =
        String(seconds).padStart(2, "0");

}


/* Run immediately */

updateCountdown();


/* Update every second */

setInterval(
    updateCountdown,
    1000
);

</script>
