<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="description"
      content="RIVOLAND® — Sport. Street. Culture. Launching 11 September 2026.">

<meta name="theme-color"
      content="#070707">

<title>RIVOLAND® — Coming Soon</title>


<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #070707;
    color: #f5f5f0;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}


/* =====================================================
   BACKGROUND
===================================================== */

body::before {
    content: "";

    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(255,255,255,0.075),
            transparent 35%
        );

    pointer-events: none;
    z-index: -3;
}


body::after {
    content: "";

    position: fixed;
    inset: 0;

    background:
        linear-gradient(
            120deg,
            transparent 35%,
            rgba(255,255,255,0.025),
            transparent 65%
        );

    animation: backgroundMove 12s ease-in-out infinite;

    pointer-events: none;
    z-index: -2;
}


@keyframes backgroundMove {

    0% {
        transform: translateX(-15%);
    }

    50% {
        transform: translateX(15%);
    }

    100% {
        transform: translateX(-15%);
    }

}


/* =====================================================
   PAGE
===================================================== */

.page {
    min-height: 100vh;

    display: flex;
    flex-direction: column;

    position: relative;

    overflow: hidden;
}


/* =====================================================
   HEADER
===================================================== */

header {

    width: 100%;

    padding: 28px 42px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    position: relative;

    z-index: 10;
}


.logo {

    font-size: 21px;

    font-weight: 900;

    letter-spacing: 0.22em;
}


.logo sup {

    font-size: 8px;

    margin-left: 2px;

    vertical-align: top;
}


.established {

    font-size: 9px;

    letter-spacing: 0.25em;

    opacity: 0.4;
}


/* =====================================================
   MAIN
===================================================== */

main {

    flex: 1;

    width: 100%;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 30px 20px 60px;
}


.content {

    width: min(1100px, 100%);

    text-align: center;
}


/* =====================================================
   EYEBROW
===================================================== */

.eyebrow {

    font-size: 10px;

    font-weight: 600;

    letter-spacing: 0.38em;

    opacity: 0.45;

    margin-bottom: 25px;

    animation: fadeUp 1s ease forwards;
}


/* =====================================================
   TITLE
===================================================== */

.title {

    font-size: clamp(60px, 13vw, 175px);

    line-height: 0.82;

    font-weight: 900;

    letter-spacing: -0.075em;

    text-transform: uppercase;

    animation: fadeUp 1s ease 0.15s forwards;

    opacity: 0;
}


.title span {

    display: block;
}


.outline {

    color: transparent;

    -webkit-text-stroke:
        1px rgba(245,245,240,0.7);
}


/* =====================================================
   VIDEO AREA
===================================================== */

.model-area {

    width: 100%;

    height: 470px;

    margin-top: 45px;

    display: flex;

    justify-content: center;

    align-items: center;

    position: relative;
}


/* =====================================================
   MODEL VIDEO
===================================================== */

.model-video {

    width: 260px;

    height: 440px;

    object-fit: contain;

    display: block;

    position: relative;

    z-index: 3;

    background: transparent;

    border: none;

    outline: none;

    mix-blend-mode: normal;

}


/* =====================================================
   MODEL SHADOW
===================================================== */
