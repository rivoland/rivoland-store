/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;

/* =====================================================
   BODY
===================================================== */

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #080808;
    color: #f5f5f0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x: hidden;

/* =====================================================
   MAIN PAGE
===================================================== */

.page {
    min-height: 100vh;

    position: relative;

    display: flex;
    flex-direction: column;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            #1c1c1c 0%,
            #101010 30%,
            #080808 70%
        );
}


/* =====================================================
   CINEMATIC LIGHT
===================================================== */

.page::before {
    content: "";

    position: absolute;

    width: 900px;
    height: 900px;

    left: 50%;
    top: 45%;

    transform:
        translate(-50%, -50%);

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,0.07),
            transparent 65%
        );

    pointer-events: none;

    z-index: 0;
}


.page::after {
    content: "";

    position: absolute;

    inset: -50%;

    background:
        linear-gradient(
            120deg,
            transparent 40%,
            rgba(255,255,255,0.025),
            transparent 60%
        );

    animation:
        lightMove 12s ease-in-out infinite;

    pointer-events: none;

    z-index: 0;
}


@keyframes lightMove {

    0% {
        transform: translateX(-15%);
    }

    50% {
        transform: translateX(15%);
    }

    100% {
        transform: translateX(-15%);
    }

}


/* =====================================================
   FILM GRAIN
===================================================== */

.grain {
    position: fixed;

    inset: -50%;

    width: 200%;
    height: 200%;

    opacity: 0.025;

    animation:
        grainMove 0.3s steps(2) infinite;
}


@keyframes grainMove {

    0% {
        transform: translate(0,0);
    }

    25% {
        transform: translate(2%,-1%);
    }

    50% {
        transform: translate(-1%,2%);
    }

    75% {
        transform: translate(1%,1%);
    }

    100% {

<script>

(function () {

    /*
       LAUNCH DATE

       11 September 2026
       12:00 AM
       India Standard Time (IST)
    */

    const launchDate =
        new Date(
            "2026-09-11T00:00:00+05:30"
        );


    function updateCountdown() {

        const now =
            new Date();


        let difference =
            launchDate.getTime()
            -
            now.getTime();


        /* -----------------------------------------
           WHEN LAUNCH TIME ARRIVES
        ----------------------------------------- */

        if (difference <= 0) {

            document.body
                .classList
                .add("is-live");

            return;
        }


        /* -----------------------------------------
           CALCULATE TIME
        ----------------------------------------- */

        const totalSeconds =
            Math.floor(
                difference / 1000
            );


        const days =
            Math.floor(
                totalSeconds / 86400
            );


        const hours =
            Math.floor(
                (totalSeconds % 86400)
                / 3600
            );


        const minutes =
            Math.floor(
                (totalSeconds % 3600)
                / 60
            );


        const seconds =
            totalSeconds % 60;


        /* -----------------------------------------
           DISPLAY
        ----------------------------------------- */

        document.getElementById("days")
            .textContent =
            String(days)
                .padStart(2, "0");


        document.getElementById("hours")
            .textContent =
            String(hours)
                .padStart(2, "0");


        document.getElementById("minutes")
            .textContent =
            String(minutes)
                .padStart(2, "0");


        document.getElementById("seconds")
            .textContent =
            String(seconds)
                .padStart(2, "0");

    }


    /* Run immediately */

    updateCountdown();


    /* Update every second */

    setInterval(
        updateCountdown,
        1000
    );

})();

</script>
