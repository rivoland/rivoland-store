<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="description"
      content="RIVOLAND® — Sport. Street. Culture. Launching 11 September 2026.">

<meta name="theme-color"
      content="#070707">

<title>RIVOLAND® — Coming Soon</title>


<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #070707;
    color: #f5f5f0;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}


/* =====================================================
   BACKGROUND
   NO CIRCLE
===================================================== */

body {
    background:
        linear-gradient(
            180deg,
            #080808 0%,
            #070707 50%,
            #050505 100%
        );
}


/* =====================================================
   PAGE
===================================================== */

.page {
    min-height: 100vh;

    display: flex;
    flex-direction: column;

    position: relative;

    overflow: hidden;
}


/* =====================================================
   HEADER
===================================================== */

header {

    width: 100%;

    padding: 28px 42px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    position: relative;

    z-index: 10;
}


.logo {

    font-size: 21px;

    font-weight: 900;

    letter-spacing: 0.22em;
}


.logo sup {

    font-size: 8px;

    margin-left: 2px;

    vertical-align: top;
}


.established {

    font-size: 9px;

    letter-spacing: 0.25em;

    opacity: 0.4;
}


/* =====================================================
   MAIN
===================================================== */

main {

    flex: 1;

    width: 100%;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 30px 20px 60px;
}


.content {

    width: min(1100px, 100%);

    text-align: center;
}


/* =====================================================
   EYEBROW
===================================================== */

.eyebrow {

    font-size: 10px;

    font-weight: 600;

    letter-spacing: 0.38em;

    opacity: 0.75;

    margin-bottom: 25px;

    animation: fadeUp 0.8s ease both;
}


/* =====================================================
   TITLE
===================================================== */

.title {

    font-size: clamp(60px, 13vw, 175px);

    line-height: 0.82;

    font-weight: 900;

    letter-spacing: -0.075em;

    text-transform: uppercase;

    animation: fadeUp 0.8s ease 0.1s both;
}


.title span {

    display: block;
}


.outline {

    color: transparent;

    -webkit-text-stroke:
        1px rgba(245,245,240,0.7);

    text-stroke:
        1px rgba(245,245,240,0.7);
}


/* =====================================================
   VIDEO AREA
===================================================== */

.model-area {

    width: 100%;

    height: 440px;

    margin-top: 35px;

    display: flex;

    justify-content: center;

    align-items: center;

    position: relative;

    animation: fadeUp 0.9s ease 0.2s both;
}


/* =====================================================
   MODEL VIDEO

   DESKTOP SIZE
===================================================== */

.model-video {

    width: 260px;

    height: 400px;

    object-fit: cover;

    display: block;

    position: relative;

    z-index: 3;

    background: transparent;

    border: none;

    outline: none;

    border-radius: 0;

    box-shadow:
        0 25px 70px rgba(0,0,0,0.55);
}


/* =====================================================
   MODEL SHADOW
===================================================== */

.model-shadow {

    position: absolute;

    width: 220px;

    height: 28px;

    bottom: 8px;

    left: 50%;

    transform: translateX(-50%);

    border-radius: 50%;

    background:
        rgba(0,0,0,0.85);

    filter: blur(14px);

    z-index: 1;
}


/* =====================================================
   DESCRIPTION
===================================================== */

.description {

    margin: 10px auto 0;

    max-width: 500px;

    font-size: 13px;

    line-height: 1.7;

    letter-spacing: 0.08em;

    color:
        rgba(245,245,240,0.58);

    animation:
        fadeUp 0.8s ease 0.3s both;
}


/* =====================================================
   COUNTDOWN
===================================================== */

.countdown {

    display: flex;

    justify-content: center;

    align-items: flex-start;

    gap: clamp(10px,4vw,50px);

    margin-top: 48px;

    animation:
        fadeUp 0.8s ease 0.4s both;
}


.time {

    min-width: 70px;
}


.number {

    display: block;

    font-size:
        clamp(35px,6vw,70px);

    line-height: 1;

    font-weight: 700;

    letter-spacing: -0.05em;

    font-variant-numeric:
        tabular-nums;
}


.label {

    display: block;

    margin-top: 11px;

    font-size: 8px;

    letter-spacing: 0.25em;

    text-transform: uppercase;

    opacity: 0.4;
}


.colon {

    font-size: 28px;

    opacity: 0.25;

    padding-top: 5px;
}


/* =====================================================
   LAUNCH DATE
===================================================== */

.launch {

    display: inline-flex;

    align-items: center;

    gap: 15px;

    margin-top: 35px;

    padding: 13px 20px;

    border:
        1px solid rgba(245,245,240,0.13);

    background:
        rgba(255,255,255,0.025);
}


.launch-label {

    font-size: 8px;

    letter-spacing: 0.25em;

    opacity: 0.4;
}


.launch-date {

    font-size: 12px;

    font-weight: 700;

    letter-spacing: 0.16em;
}


/* =====================================================
   CONTACT
===================================================== */

.contact {

    display: flex;

    justify-content: center;

    gap: 15px;

    margin-top: 28px;

    flex-wrap: wrap;
}


.contact a {

    color: #f5f5f0;

    text-decoration: none;

    border:
        1px solid rgba(245,245,240,0.15);

    padding: 13px 20px;

    font-size: 9px;

    font-weight: 700;

    letter-spacing: 0.18em;

    text-transform: uppercase;

    transition:
        background 0.3s,
        border 0.3s,
        transform 0.3s;
}


.contact a:hover {

    background:
        rgba(255,255,255,0.08);

    border-color:
        rgba(255,255,255,0.4);

    transform:
        translateY(-2px);
}


/* =====================================================
   LIVE
===================================================== */

.live {

    display: none;

    margin-top: 45px;

    font-size:
        clamp(40px,7vw,80px);

    font-weight: 900;

    letter-spacing: -0.05em;
}


body.is-live .countdown,
body.is-live .launch {

    display: none;
}


body.is-live .live {

    display: block;

    animation:
        fadeUp 1s ease both;
}


/* =====================================================
   FOOTER
===================================================== */

footer {

    padding: 25px 20px 28px;

    text-align: center;
}


.footer-text {

    font-size: 8px;

    font-weight: 600;

    letter-spacing: 0.3em;

    opacity: 0.28;
}


/* =====================================================
   ANIMATION
===================================================== */

@keyframes fadeUp {

    from {

        opacity: 0;

        transform:
            translateY(20px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }

}


/* =====================================================
   TABLET
===================================================== */

@media (max-width: 900px) {

    .model-area {

        height: 420px;

    }

    .model-video {

        width: 250px;

        height: 390px;

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 650px) {

    header {

        padding: 22px 20px;

    }


    .logo {

        font-size: 17px;

        letter-spacing: 0.18em;

    }


    .established {

        font-size: 7px;

        letter-spacing: 0.18em;

    }


    main {

        padding:
            25px 15px 45px;

        align-items: flex-start;

    }


    .content {

        width: 100%;

    }


    .eyebrow {

        font-size: 8px;

        letter-spacing: 0.25em;

        margin-bottom: 22px;

        white-space: nowrap;

    }


    .title {

        font-size:
            clamp(52px,17vw,105px);

    }


    /* ---------------------------------------------
       MOBILE VIDEO
    --------------------------------------------- */

    .model-area {

        height: 380px;

        margin-top: 25px;

    }


    .model-video {

        width: 220px;

        height: 350px;

        object-fit: cover;

    }


    .model-shadow {

        width: 180px;

        height: 22px;

        bottom: 8px;

    }


    .description {

        font-size: 11px;

        max-width: 320px;

        margin-top: 5px;

    }


    /* ---------------------------------------------
       MOBILE COUNTDOWN
    --------------------------------------------- */

    .countdown {

        gap: 5px;

        margin-top: 40px;

    }


    .time {

        min-width: 55px;

    }


    .number {

        font-size:
            clamp(27px,9vw,43px);

    }


    .label {

        font-size: 6px;

        letter-spacing: 0.12em;

    }


    .colon {

        font-size: 20px;

        padding-top: 3px;

    }


    /* ---------------------------------------------
       MOBILE LAUNCH
    --------------------------------------------- */

    .launch {

        margin-top: 30px;

        padding: 11px 14px;

        gap: 10px;

    }


    .launch-label {

        font-size: 7px;

    }


    .launch-date {

        font-size: 11px;

    }


    /* ---------------------------------------------
       MOBILE CONTACT
    --------------------------------------------- */

    .contact {

        margin-top: 22px;

        gap: 10px;

    }


    .contact a {

        padding: 12px 14px;

        font-size: 7px;

    }


    /* ---------------------------------------------
       MOBILE FOOTER
    --------------------------------------------- */

    footer {

        padding:
            20px 15px 25px;

    }


    .footer-text {

        font-size: 7px;

        letter-spacing: 0.2em;

    }

}


/* =====================================================
   VERY SMALL PHONES
===================================================== */

@media (max-width: 380px) {

    .eyebrow {

        font-size: 7px;

        letter-spacing: 0.2em;

    }


    .model-area {

        height: 350px;

    }


    .model-video {
