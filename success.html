<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed | RIVOLAND®</title>
<style>
:root{--black:#080808;--white:#fff;--grey:#888;--line:rgba(255,255,255,.12);--accent:#d9ff00;--max:1100px}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;background:var(--black);color:var(--white);line-height:1.5}a{color:inherit;text-decoration:none}.nav{max-width:var(--max);height:76px;margin:auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{font-size:25px;font-weight:1000;letter-spacing:-2px}.logo span{color:var(--accent)}.back{color:#aaa;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase}.back:hover{color:#fff}.page{max-width:var(--max);margin:auto;padding:75px 28px 120px}.confirmation{max-width:850px;margin:auto}.mark{width:68px;height:68px;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:30px;font-weight:1000;margin-bottom:28px}.kicker{color:var(--accent);font-size:11px;font-weight:900;letter-spacing:3px;text-transform:uppercase;margin-bottom:12px}h1{font-size:clamp(42px,7vw,82px);line-height:.9;letter-spacing:-5px;text-transform:uppercase;margin-bottom:18px}.lead{color:#aaa;max-width:650px;font-size:14px;margin-bottom:45px}.box{border:1px solid var(--line);padding:25px;margin-bottom:20px}.title{font-size:13px;font-weight:900;letter-spacing:1px;text-transform:uppercase;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:4px}.item{display:grid;grid-template-columns:75px 1fr auto;gap:14px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.item-image{width:75px;height:88px;background:#eee;overflow:hidden}.item-image img{width:100%;height:100%;object-fit:cover}.item-name{font-size:12px;font-weight:900;text-transform:uppercase}.meta{color:#777;font-size:10px;margin-top:5px}.price{font-size:12px;font-weight:900;white-space:nowrap}.total{display:flex;justify-content:space-between;padding-top:20px;font-size:18px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}.details h2{font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin-bottom:15px}.details p{color:#aaa;font-size:12px;line-height:1.8;white-space:pre-line}.status{border:1px solid rgba(217,255,0,.35);background:rgba(217,255,0,.06);color:var(--accent);padding:14px 16px;margin-bottom:25px;font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.btn{display:inline-block;padding:16px 22px;font-size:10px;font-weight:1000;letter-spacing:1.5px;text-transform:uppercase;border:1px solid #fff}.primary{background:var(--accent);color:#000;border-color:var(--accent)}.btn:hover{background:#fff;color:#000}.empty{text-align:center;color:#777;padding:35px}.empty .btn{margin-top:20px}footer{border-top:1px solid var(--line);background:#050505}.foot{max-width:var(--max);margin:auto;padding:40px 28px;color:#555;font-size:10px;text-transform:uppercase;letter-spacing:1px}@media(max-width:700px){.nav{padding:0 16px}.page{padding:55px 16px 80px}.grid{grid-template-columns:1fr}.item{grid-template-columns:60px 1fr auto}.item-image{width:60px;height:72px}}
</style>
</head>
<body>
<header><div class="nav"><a class="logo" href="index.html">RIVOLAND<span>®</span></a><a class="back" href="index.html#shop">Continue Shopping →</a></div></header>
<main class="page"><div class="confirmation"><div class="mark">✓</div><div class="kicker">RIVOLAND® / ORDER CONFIRMED</div><h1>Thank You.</h1><p class="lead">Your payment has been verified successfully. Your order details are shown below.</p><div class="status">Payment verified successfully</div><div id="content"></div></div></main>
<footer><div class="foot">© 2026 RIVOLAND®. ALL RIGHTS RESERVED.</div></footer>
<script>
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
const money=v=>'₹'+Number(v).toLocaleString('en-IN');
let checkout=null,payment=null;
try{checkout=JSON.parse(localStorage.getItem('rivolandCheckout'));payment=JSON.parse(localStorage.getItem('rivolandPayment'))}catch(e){}
const content=document.getElementById('content');
if(!checkout||!payment||!payment.verified){content.innerHTML='<div class="box empty"><p>We could not find a verified order on this device.</p><a class="btn primary" href="index.html">Back to RIVOLAND</a></div>';}else{const c=checkout.customer||{},s=checkout.shipping||{},items=Array.isArray(checkout.items)?checkout.items:[];let total=0;const html=items.map(i=>{const q=i.quantity||1,t=Number(i.price)*q;total+=t;return `<div class="item"><div class="item-image">${i.image?`<img src="${esc(i.image)}" alt="${esc(i.name)}">`:''}</div><div><div class="item-name">${esc(i.name)}</div><div class="meta">${i.size?'Size: '+esc(i.size)+' · ':''}Qty: ${q}</div></div><div class="price">${money(t)}</div></div>`}).join('');content.innerHTML=`<div class="box"><div class="title">Order Summary</div>${html}<div class="total"><span>Total</span><span>${money(total)}</span></div></div><div class="grid"><div class="box details"><h2>Customer</h2><p>${esc(c.firstName)} ${esc(c.lastName)}
${esc(c.email)}
${esc(c.phone)}</p></div><div class="box details"><h2>Shipping</h2><p>${esc(s.address)}
${esc(s.city)}
${esc(s.state)} - ${esc(s.pincode)}
${esc(s.country)}</p></div></div><div class="box details"><h2>Payment Details</h2><p>Payment ID: ${esc(payment.paymentId)}
Order ID: ${esc(payment.orderId)}
Status: Verified</p></div><div class="actions"><a class="btn primary" href="index.html#shop">Continue Shopping</a><a class="btn" href="index.html">Back Home</a></div>`;localStorage.removeItem('rivolandCart');}
</script>
</body>
</html>
